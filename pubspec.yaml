name: hyperlocal_customer
description: Hyperlocal Customer App — pesan kurir sepeda/jalan kaki dalam 1 km.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  hyperlocal_shared:
    git:
      url: https://github.com/hodeifabaswel/hyperlocal-shared.git
      ref: main
  flutter_riverpod: ^2.6.0
  go_router: ^14.8.0
  dio: ^5.7.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
